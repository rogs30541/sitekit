# Render 免費方案 Blueprint（不需付款資訊）：free web service（Docker）＋ free PostgreSQL
#   限制：免費 web 沒有持久硬碟（上傳檔重新部署會清掉→精靈第 3 步請選 R2）、15 分鐘無流量會休眠、512MB RAM；免費 Postgres 30 天後到期
#   使用：Dashboard → New → Blueprint → 貼公開 repo URL → Blueprint Path 填 deploy/render-free.yaml → Apply
#   正式環境請用根目錄 render.yaml（starter＋持久硬碟）
services:
  - type: web
    name: sitekit-free
    runtime: docker
    dockerfilePath: ./Dockerfile.monolith
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: SITEKIT_DATA_DIR
        value: /data
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: sitekit-free-db
          property: connectionString
databases:
  - name: sitekit-free-db
    plan: free
    postgresMajorVersion: "16"
