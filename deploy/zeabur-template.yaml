# Zeabur Template：SiteKit 單體殼＋PostgreSQL（一鍵部署）
# 部署方式（2026-09-26 實測）：`npx zeabur@latest template deploy -f deploy/zeabur-template.yaml --project-id <專案ID> --var PUBLIC_DOMAIN=<子網域前綴> -i=false`
#   （儀表板「建立新模板」只導向文件，沒有貼 YAML 入口；先在儀表板建空專案選好伺服器，再用 CLI 部署進去；PUBLIC_DOMAIN 只填前綴，CLI 會自動加 .zeabur.app）
# 注意：ghcr.io/rogs30541/sitekit 在原始碼 repo 公開前是私有映像；私有時請在 Zeabur 服務加 registry 認證，或改用 Dockerfile.monolith 從 Git 建置。
apiVersion: zeabur.com/v1
kind: Template
metadata:
  name: SiteKit
spec:
  description: 電商開店／線上課程／品牌網站開放套件：後台 AI 指令台＋MCP、台灣金流物流發票內建。一個服務＋PostgreSQL，開站後到 /setup 建立管理員。
  icon: https://raw.githubusercontent.com/rogs30541/sitekit/main/apps/web/public/favicon.ico
  tags:
    - CMS
    - E-commerce
    - Course
  variables:
    - key: PUBLIC_DOMAIN
      type: DOMAIN
      name: 網域
      description: 站台的公開網址（金流回呼、Email 連結、MCP 都用它；之後可在後台「網站設定」改）
  readme: |
    ## SiteKit
    1. 部署完成後開啟網域 → 自動導到 `/setup`，建立第一位超級管理員、填站名、儲存（建議 Cloudflare R2）、Email（Resend）。
    2. 金流／物流／發票在後台「帳務」填各家商店參數。
    3. MCP 連接用的 OPS token 在精靈完成頁或「系統設定 → 健康檢查與支援」查看。
    4. 更新：把 sitekit 服務的映像 tag 改成新版號後重新部署，資料庫遷移會自動套用。
  services:
    - name: postgresql
      icon: https://raw.githubusercontent.com/zeabur/service-icons/main/marketplace/postgresql.svg
      template: PREBUILT
      spec:
        source:
          image: postgres:16-alpine
        ports:
          - id: database
            port: 5432
            type: TCP
        volumes:
          - id: data
            dir: /var/lib/postgresql/data
        env:
          # expose=true 才能被 sitekit 服務以 ${POSTGRES_*} 引用（2026-09-26 一鍵模板實測：沒 expose ＝ P1000 密碼不對）
          POSTGRES_USER:
            default: sitekit
            expose: true
            readonly: true
          POSTGRES_PASSWORD:
            default: ${PASSWORD}
            expose: true
          POSTGRES_DB:
            default: sitekit
            expose: true
            readonly: true
          POSTGRES_HOST:
            default: ${CONTAINER_HOSTNAME}
            expose: true
            readonly: true
          POSTGRES_PORT:
            default: ${DATABASE_PORT}
            expose: true
            readonly: true
          POSTGRES_CONNECTION_STRING:
            default: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
            expose: true
            readonly: true
          PGDATA:
            default: /var/lib/postgresql/data/pgdata
        instructions:
          - type: TEXT
            title: 連線字串
            content: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${PORT_FORWARDED_HOSTNAME}:${DATABASE_PORT_FORWARDED_PORT}/${POSTGRES_DB}
            category: 連線
    - name: sitekit
      icon: https://raw.githubusercontent.com/rogs30541/sitekit/main/apps/web/public/favicon.ico
      template: PREBUILT
      domainKey: PUBLIC_DOMAIN
      dependencies:
        - postgresql
      spec:
        source:
          image: ghcr.io/rogs30541/sitekit:latest
        ports:
          - id: web
            port: 3000
            type: HTTP
        volumes:
          - id: data
            dir: /data
        env:
          DATABASE_URL:
            default: ${POSTGRES_CONNECTION_STRING}
          # ${PUBLIC_DOMAIN} 在 CLI 部署時只會展開成子網域前綴（sitekit-tpl-test），不能直接拼網址；
          # 改用 Zeabur 特殊變數 ${ZEABUR_WEB_URL}（port id=web 的公開網址，自訂網域也對）
          FRONTEND_URL:
            default: ${ZEABUR_WEB_URL}
          NEXT_PUBLIC_SITE_URL:
            default: ${ZEABUR_WEB_URL}
          APP_ENV:
            default: production
          PORT:
            default: "3000"
          SITEKIT_DATA_DIR:
            default: /data
