# Render Blueprint：Dashboard → New → Blueprint → 選這個 repo 即一鍵建立 web 服務＋持久硬碟（/data）＋PostgreSQL
# 部署完成後開網址 → /setup
services:
  - type: web
    name: sitekit
    runtime: docker
    dockerfilePath: ./Dockerfile.monolith
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: sitekit-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: SITEKIT_DATA_DIR
        value: /data
      - key: FRONTEND_URL
        fromService: { type: web, name: sitekit, envVarKey: RENDER_EXTERNAL_URL }
      - key: NEXT_PUBLIC_SITE_URL
        fromService: { type: web, name: sitekit, envVarKey: RENDER_EXTERNAL_URL }
      - key: DATABASE_URL
        fromDatabase: { name: sitekit-db, property: connectionString }
databases:
  - name: sitekit-db
    plan: basic-256mb
    postgresMajorVersion: "16"
