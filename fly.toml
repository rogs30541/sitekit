# Fly.io：fly launch --copy-config --no-deploy → fly volumes create sitekit_data --size 3 → fly deploy → 開 https://<app>.fly.dev/setup
# 預設 SQLite 存在 volume（/data）；要 Postgres：fly postgres create 後 fly secrets set DATABASE_URL=postgres://…
app = "sitekit"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile.monolith"

[env]
  APP_ENV = "production"
  PORT = "3000"
  SITEKIT_DATA_DIR = "/data"

[mounts]
  source = "sitekit_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "40s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
