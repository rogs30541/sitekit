name: release
# 打 tag v* 即發行：① GHCR 單體映像 ghcr.io/<owner>/sitekit:<版號>＋latest ② 免建置的發行包 sitekit-<版號>.tar.gz（含 node_modules 與 web 建置，解壓即可 sitekit start）③ GitHub Release（附 CHANGELOG 該版段落）
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.monolith
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/sitekit:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/sitekit:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: build（單體殼；NEXT_PUBLIC_SITE_URL 由後台 site.url 覆蓋，這裡用預設）
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_APP_ENV: production
          API_INTERNAL_URL: http://127.0.0.1:3000
      - name: 精簡（去 devDependencies 與原始碼，保留執行所需）
        run: |
          npm prune --omit=dev --no-audit --no-fund
          rm -rf apps/web/.next/cache apps/edge tests docs .github
      - id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: 打包
        run: |
          mkdir -p /tmp/out
          tar --exclude=.git -czf /tmp/out/sitekit-${{ steps.meta.outputs.version }}.tar.gz .
          ls -la /tmp/out
      - name: 該版 CHANGELOG 段落
        run: node scripts/release.mjs notes ${{ steps.meta.outputs.version }} > /tmp/out/notes.md || echo "v${{ steps.meta.outputs.version }}" > /tmp/out/notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: SiteKit v${{ steps.meta.outputs.version }}
          body_path: /tmp/out/notes.md
          files: /tmp/out/sitekit-${{ steps.meta.outputs.version }}.tar.gz
