name: ci
on:
  push:
    branches: [main]
  pull_request:
env:
  APP_ENV: development
  SESSION_SECRET: ci-session-secret-not-for-production
  OPS_TOKEN: ci-ops-token
  FRONTEND_URL: http://localhost:3000
  API_INTERNAL_URL: http://localhost:4000
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  NEXT_PUBLIC_APP_ENV: development
  # e2e 會連續登入數百次；限流關閉、測試以 E2E_RATE_LIMIT_OFF 跳過限流案例
  RATE_LIMIT: off
  E2E_RATE_LIMIT_OFF: '1'
jobs:
  # 一份模型、兩種資料庫、兩種殼：同一套 e2e 分別對「分離殼＋PostgreSQL」「分離殼＋SQLite」「單體殼＋SQLite」跑
  e2e-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sitekit
          POSTGRES_PASSWORD: sitekit
          POSTGRES_DB: sitekit
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sitekit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://sitekit:sitekit@localhost:5432/sitekit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build -w @sitekit/shared
      - run: npm run build -w @sitekit/db
      - run: npm run db:validate -w @sitekit/api
      - run: npm run build -w @sitekit/core
      - run: npm run build -w @sitekit/api
      - run: npm run build -w @sitekit/web
      - run: node --check mcp/server.mjs
      - name: migrate + seed
        run: npm run db:migrate -w @sitekit/api && SEED_DEMO=1 npm run db:seed -w @sitekit/api
      - name: start api
        run: (cd apps/api && PORT=4000 nohup node dist/main.js > /tmp/api.log 2>&1 &) && for i in $(seq 1 30); do curl -sf http://localhost:4000/api/health && break; sleep 2; done
      - name: start web
        run: (cd apps/web && nohup npx next start -p 3000 > /tmp/web.log 2>&1 &) && for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000/ && break; sleep 2; done
      - name: e2e
        run: node tests/e2e/run.mjs
      - name: logs on failure
        if: failure()
        run: tail -n 120 /tmp/api.log; tail -n 60 /tmp/web.log

  e2e-sqlite:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:${{ github.workspace }}/data/ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build -w @sitekit/shared
      - run: npm run build -w @sitekit/db
      - run: npm run db:validate -w @sitekit/api
      - run: npm run build -w @sitekit/core
      - run: npm run build -w @sitekit/api
      - run: npm run build -w @sitekit/web
      - name: migrate + seed（SQLite）
        run: mkdir -p data && npm run db:migrate -w @sitekit/api && SEED_DEMO=1 npm run db:seed -w @sitekit/api
      - name: start api
        run: (cd apps/api && PORT=4000 nohup node dist/main.js > /tmp/api.log 2>&1 &) && for i in $(seq 1 30); do curl -sf http://localhost:4000/api/health && break; sleep 2; done
      - name: start web
        run: (cd apps/web && nohup npx next start -p 3000 > /tmp/web.log 2>&1 &) && for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000/ && break; sleep 2; done
      - name: e2e
        run: node tests/e2e/run.mjs
      - name: logs on failure
        if: failure()
        run: tail -n 120 /tmp/api.log; tail -n 60 /tmp/web.log

  # 單體殼：sitekit start（一個程序、一個埠、SQLite），api 與 web 都在 3000
  e2e-monolith:
    runs-on: ubuntu-latest
    env:
      API_INTERNAL_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build -w @sitekit/shared
      - run: npm run build -w @sitekit/db
      - run: npm run build -w @sitekit/core
      - run: npm run build -w @sitekit/api
      - run: npm run build -w @sitekit/web
      - run: npm run build -w @sitekit/server
      - name: sitekit start（demo 種子）
        run: (nohup node apps/server/bin/sitekit.mjs start --demo --port 3000 --data ${{ github.workspace }}/data/mono > /tmp/mono.log 2>&1 &) && for i in $(seq 1 45); do curl -sf http://localhost:3000/api/health && curl -sf -o /dev/null http://localhost:3000/ && break; sleep 2; done
      - name: e2e（API 與 WEB 同埠）
        run: API=http://localhost:3000 WEB=http://localhost:3000 node tests/e2e/run.mjs
      - name: logs on failure
        if: failure()
        run: tail -n 150 /tmp/mono.log

  e2e-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sitekit
          MYSQL_USER: sitekit
          MYSQL_PASSWORD: sitekit
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: mysql://sitekit:sitekit@127.0.0.1:3306/sitekit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build -w @sitekit/shared
      - run: npm run build -w @sitekit/db
      - run: npm run db:validate -w @sitekit/api
      - run: npm run build -w @sitekit/core
      - run: npm run build -w @sitekit/api
      - run: npm run build -w @sitekit/web
      - name: migrate + seed（MySQL）
        run: npm run db:migrate -w @sitekit/api && SEED_DEMO=1 npm run db:seed -w @sitekit/api
      - name: start api
        run: (cd apps/api && PORT=4000 nohup node dist/main.js > /tmp/api.log 2>&1 &) && for i in $(seq 1 30); do curl -sf http://localhost:4000/api/health && break; sleep 2; done
      - name: start web
        run: (cd apps/web && nohup npx next start -p 3000 > /tmp/web.log 2>&1 &) && for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000/ && break; sleep 2; done
      - name: e2e
        run: node tests/e2e/run.mjs
      - name: logs on failure
        if: failure()
        run: tail -n 120 /tmp/api.log; tail -n 60 /tmp/web.log

  # deploy/compose：Caddy（自簽 localhost）＋單體映像＋Postgres 從原始碼建起，經 Caddy 走 HTTPS 打 /api/health 與 /setup
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compose up
        working-directory: deploy/compose
        run: |
          DOMAIN=localhost POSTGRES_PASSWORD=ci docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build
          for i in $(seq 1 60); do curl -skf https://localhost/api/health && break; sleep 5; done
      - name: smoke
        run: |
          curl -sk https://localhost/api/health | tee /tmp/h.json | grep -q '"db":"ok"'
          curl -sk https://localhost/api/setup/status | tee /tmp/s.json | grep -q '"persistent":true'
          curl -sk -o /dev/null -w '%{http_code}
' https://localhost/setup | grep -q 200
      - name: logs on failure
        if: failure()
        working-directory: deploy/compose
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --tail 150

